# ============================================================================
# Unified CI/CD Pipeline
# Comprehensive testing, linting, type-checking, security, and build
# ============================================================================

name: CI

on:
  push:
    branches: [main, master, copilot/**]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================================================
  # Basic Tests - No project dependencies (from former tests.yml)
  # ============================================================================
  test-basic:
    name: Basic Tests (No Dependencies)
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pytest
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov

      - name: Run basic tests
        run: |
          python scripts/utils/run_tests.py --quick

      - name: Test summary
        if: always()
        run: |
          echo "### Basic Test Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ Basic tests completed (no dependencies required)" >> $GITHUB_STEP_SUMMARY

  # ============================================================================
  # Test Job - Run pytest with coverage across Python versions
  # ============================================================================
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ matrix.python-version }}-${{ hashFiles('pyproject.toml', 'uv.lock') }}
          restore-keys: |
            ${{ runner.os }}-pip-${{ matrix.python-version }}-
            ${{ runner.os }}-pip-

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y freetds-dev unixodbc-dev

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,mcp]"

      - name: Run tests with coverage
        run: |
          pytest tests/ -v --tb=short \
            --cov=src \
            --cov-report=xml \
            --cov-report=term-missing \
            -m "not requires_db and not requires_api"
        env:
          PYTHONPATH: src
          # Optional secrets from former tests.yml (CI-safe suite does not need them).
          GROK_API_KEY: ${{ secrets.GROK_API_KEY }}
          DB_SERVER: ${{ secrets.DB_SERVER }}
          DB_NAME: SmartBusiness
          DB_NAME_J3SYSTEM: J3System
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}

      # Phase 1 / issue #63: each money-path module has its own 80% floor
      # so a high-coverage file cannot hide a regression in another.
      # Phase 1 measured coverage (keep at least these levels in review):
      #   monthly 91.79%, cartera_pdf 98.06%,
      #   manager_report/queries 93.78%, website_stock_magento_ssh 94.44%.
      # Documented in docs/TESTING.md (Money-path coverage floor).
      - name: Enforce money-path coverage floor
        run: |
          coverage report --include='src/business_analyzer/reports/monthly.py' --fail-under=80 --show-missing
          coverage report --include='src/business_analyzer/reports/cartera_pdf.py' --fail-under=80 --show-missing
          coverage report --include='src/business_analyzer/analysis/manager_report/queries.py' --fail-under=80 --show-missing
          coverage report --include='src/business_analyzer/core/website_stock_magento_ssh.py' --fail-under=80 --show-missing

      - name: Upload coverage artifact
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            coverage.xml
            .coverage
          retention-days: 30

      - name: Upload coverage
        if: matrix.python-version == '3.12'
        uses: codecov/codecov-action@v3
        with:
          file: ./coverage.xml
          fail_ci_if_error: false

      - name: Test summary
        if: always()
        run: |
          echo "### Test Results (Python ${{ matrix.python-version }})" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ Tests completed" >> $GITHUB_STEP_SUMMARY

  # ============================================================================
  # Lint Job - Code formatting and style checks
  # ============================================================================
  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-lint-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-lint-

      - name: Install linting tools
        run: |
          python -m pip install --upgrade pip
          # Pin isort to pre-commit rev (5.13.2). Unpinned isort 8.x reformats
          # imports incompatibly and fails Lint on otherwise-clean trees.
          pip install black==23.12.1 isort==5.13.2 flake8 flake8-pyproject

      - name: Check code formatting with black
        run: |
          echo "::group::Black formatting check"
          black --check --diff --extend-exclude "(src/business_analyzer/ai/training.py|tests/ai/test_stability.py|tests/test_metabase_connection.py)" src/ tests/ examples/
          echo "::endgroup::"

      - name: Check import sorting with isort
        run: |
          echo "::group::isort import sorting check"
          isort --check-only --diff --skip-glob "*.backup" --skip-glob "src/business_analyzer/ai/training.py" --skip-glob "tests/ai/test_stability.py" --skip-glob "tests/test_metabase_connection.py" src/ tests/ examples/
          echo "::endgroup::"

      - name: Lint with flake8
        run: |
          echo "::group::Flake8 linting"
          flake8 src/ tests/ examples/ --exclude src/business_analyzer/analysis/customer_optimized.py --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 src/ tests/ examples/ --exclude src/business_analyzer/analysis/customer_optimized.py --count --select=F811,F841,F401 --show-source --statistics
          flake8 src/ tests/ examples/ --exclude src/business_analyzer/analysis/customer_optimized.py --count --exit-zero --statistics
          echo "::endgroup::"

      - name: Lint summary
        if: always()
        run: |
          echo "### Lint Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- Black: code formatting" >> $GITHUB_STEP_SUMMARY
          echo "- isort: import sorting" >> $GITHUB_STEP_SUMMARY
          echo "- Flake8: style and error checking" >> $GITHUB_STEP_SUMMARY

  # ============================================================================
  # Type Check Job - Static type analysis with mypy
  # ============================================================================
  type-check:
    name: Type Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-type-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-type-

      - name: Install type checking dependencies
        run: |
          python -m pip install --upgrade pip
          pip install mypy
          pip install -e ".[dev]"

      - name: Run mypy type checker
        run: |
          echo "::group::Mypy type checking"
          mypy src/business_analyzer/ai/training.py src/business_analyzer/analysis/alerts.py --follow-imports=skip --ignore-missing-imports --show-error-codes --show-column-numbers
          echo "::endgroup::"

      - name: Type check summary
        if: always()
        run: |
          echo "### Type Check Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ Static type analysis completed" >> $GITHUB_STEP_SUMMARY

  # ============================================================================
  # Security Scan Job - Bandit security analysis
  # ============================================================================
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install bandit
        run: |
          python -m pip install --upgrade pip
          pip install bandit

      - name: Run bandit security scan
        run: |
          echo "::group::Bandit security scan"
          bandit -r src/ -s B608,B314 -f json -o bandit-report.json || true
          bandit -r src/ -s B608,B314 -f screen || true
          echo "::endgroup::"

      - name: Upload bandit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bandit-security-report
          path: bandit-report.json
          retention-days: 30

      - name: Check for high severity issues
        run: |
          if [ -f bandit-report.json ]; then
            high_count=$(python -c "import json; d=json.load(open('bandit-report.json')); print(len([r for r in d.get('results',[]) if r.get('issue_severity')=='HIGH']))")
            if [ "$high_count" -gt 0 ]; then
              echo "❌ Found $high_count HIGH severity security issues"
              exit 1
            else
              echo "✅ No HIGH severity security issues found"
            fi
          fi

      - name: Security scan summary
        if: always()
        run: |
          echo "### Security Scan Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -f bandit-report.json ]; then
            total=$(python -c "import json; d=json.load(open('bandit-report.json')); print(len(d.get('results',[])))")
            high=$(python -c "import json; d=json.load(open('bandit-report.json')); print(len([r for r in d.get('results',[]) if r.get('issue_severity')=='HIGH']))")
            medium=$(python -c "import json; d=json.load(open('bandit-report.json')); print(len([r for r in d.get('results',[]) if r.get('issue_severity')=='MEDIUM']))")
            low=$(python -c "import json; d=json.load(open('bandit-report.json')); print(len([r for r in d.get('results',[]) if r.get('issue_severity')=='LOW']))")
            echo "- Total issues: $total" >> $GITHUB_STEP_SUMMARY
            echo "- HIGH: $high" >> $GITHUB_STEP_SUMMARY
            echo "- MEDIUM: $medium" >> $GITHUB_STEP_SUMMARY
            echo "- LOW: $low" >> $GITHUB_STEP_SUMMARY
          else
            echo "⚠️ Bandit report not generated" >> $GITHUB_STEP_SUMMARY
          fi

  # ============================================================================
  # Gitleaks - Phase 0 secret scan (same hook as .pre-commit-config.yaml)
  # ============================================================================
  gitleaks:
    name: Gitleaks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz -o /tmp/gitleaks.tgz
          tar -xzf /tmp/gitleaks.tgz -C /tmp gitleaks

      - name: Run gitleaks
        # Working tree only (same scope as pre-commit --all-files). Full-history
        # detect can fail on already-scrubbed commits; Phase 0 kept the hook.
        run: /tmp/gitleaks detect --source . --no-git --verbose --redact --config .gitleaks.toml

  # ============================================================================
  # Build Job - Package build verification
  # ============================================================================
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-build-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-build-

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build twine check-wheel-contents

      - name: Build package
        run: |
          echo "::group::Building package"
          python -m build
          echo "::endgroup::"

      - name: Check wheel contents
        run: |
          echo "::group::Checking wheel contents"
          check-wheel-contents --ignore W005,W009 dist/*.whl
          echo "::endgroup::"

      - name: Check package with twine
        run: |
          echo "::group::Twine package check"
          twine check dist/*
          echo "::endgroup::"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: dist/
          retention-days: 7

      - name: Build summary
        if: always()
        run: |
          echo "### Build Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ Package built successfully" >> $GITHUB_STEP_SUMMARY
          echo "- Wheel: dist/*.whl" >> $GITHUB_STEP_SUMMARY
          echo "- Source: dist/*.tar.gz" >> $GITHUB_STEP_SUMMARY

  # ============================================================================
  # CI Summary Job - Aggregate all results
  # ============================================================================
  ci-summary:
    name: CI Summary
    runs-on: ubuntu-latest
    needs: [test-basic, test, lint, type-check, security-scan, gitleaks, build]
    if: always()

    steps:
      - name: Generate CI summary
        run: |
          echo "## CI Pipeline Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Basic Tests | ${{ needs.test-basic.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Test (Python 3.11-3.12) | ${{ needs.test.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Lint | ${{ needs.lint.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Type Check | ${{ needs.type-check.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Security Scan | ${{ needs.security-scan.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Gitleaks | ${{ needs.gitleaks.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Build | ${{ needs.build.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [[ "${{ needs.test-basic.result }}" == "success" && \
                "${{ needs.test.result }}" == "success" && \
                "${{ needs.lint.result }}" == "success" && \
                "${{ needs.type-check.result }}" == "success" && \
                "${{ needs.security-scan.result }}" == "success" && \
                "${{ needs.gitleaks.result }}" == "success" && \
                "${{ needs.build.result }}" == "success" ]]; then
            echo "✅ **All CI checks passed!**" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ **Some CI checks failed**" >> $GITHUB_STEP_SUMMARY
            exit 1
          fi

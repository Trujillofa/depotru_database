# Definition: ALL references of the six brands (Vinílico / Vinilico, Viniltex,
# Koraza, Pintulux 3en1, Estucomastic, Experto Pro), including bases, special
# price, promotion, and S/I versions. Matching is by ArticulosCodigo.
# The live query reads banco_datos only (no productos_adicional join).
